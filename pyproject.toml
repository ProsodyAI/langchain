[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "langchain-prosodyai"
version = "0.3.0"
description = "ProsodyAI LangChain tool for transcripts, recording-local speaker turns, and measured acoustics"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Prosody AI, Inc." }]
keywords = [
    "acoustics",
    "audio",
    "diarization",
    "langchain",
    "langchain-integration",
    "prosodyai",
    "speech",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25,<1",
    "langchain-core>=1.4.7,<2",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "langchain-tests==1.1.9",
    "pytest>=9.0.3,<10",
    "ruff>=0.8,<1",
    "twine>=5,<7",
]

[project.urls]
Homepage = "https://prosodyai.app"
Documentation = "https://prosodyai.app/docs/guides"
Repository = "https://github.com/ProsodyAI/langchain"
Issues = "https://github.com/ProsodyAI/langchain/issues"
"API Reference" = "https://prosodyai.app/docs/reference"

[tool.hatch.build.targets.wheel]
packages = ["langchain_prosodyai", "prosodyai_langchain"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
